<svg width="120" height="120" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle -->
  <circle cx="60" cy="60" r="56" fill="url(#gradient)" stroke="white" stroke-width="8"/>
  
  <!-- Voice wave animation circles -->
  <circle cx="60" cy="60" r="20" fill="none" stroke="white" stroke-width="3" opacity="0.8"/>
  <circle cx="60" cy="60" r="30" fill="none" stroke="white" stroke-width="2" opacity="0.6"/>
  <circle cx="60" cy="60" r="40" fill="none" stroke="white" stroke-width="1" opacity="0.4"/>
  
  <!-- Microphone icon -->
  <rect x="52" y="35" width="16" height="25" rx="8" fill="white"/>
  <rect x="55" y="65" width="10" height="8" fill="white"/>
  <rect x="50" y="75" width="20" height="3" fill="white"/>
  
  <!-- AI accent dots -->
  <circle cx="35" cy="35" r="3" fill="white" opacity="0.9"/>
  <circle cx="85" cy="35" r="3" fill="white" opacity="0.7"/>
  <circle cx="35" cy="85" r="3" fill="white" opacity="0.7"/>
  <circle cx="85" cy="85" r="3" fill="white" opacity="0.9"/>
  
  <!-- Gradient definitions -->
  <defs>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0ea5e9;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#7c3aed;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0284c7;stop-opacity:1" />
    </linearGradient>
  </defs>
</svg>