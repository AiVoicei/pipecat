<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline - Agenty Platform</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            text-align: center;
            padding: 2rem;
            max-width: 500px;
        }

        .icon {
            width: 80px;
            height: 80px;
            margin: 0 auto 2rem;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            font-weight: 700;
        }

        p {
            font-size: 1.1rem;
            opacity: 0.9;
            line-height: 1.6;
            margin-bottom: 2rem;
        }

        .buttons {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            align-items: center;
        }

        button {
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.3);
            color: white;
            padding: 1rem 2rem;
            border-radius: 50px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
            min-width: 200px;
        }

        button:hover {
            background: rgba(255, 255, 255, 0.3);
            border-color: rgba(255, 255, 255, 0.5);
            transform: translateY(-2px);
        }

        .status {
            margin-top: 2rem;
            padding: 1rem;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            font-size: 0.9rem;
            opacity: 0.8;
        }

        @media (max-width: 768px) {
            .container {
                padding: 1rem;
            }

            h1 {
                font-size: 2rem;
            }

            p {
                font-size: 1rem;
            }
        }

        .pulse {
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.7; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon pulse">
            🌐
        </div>

        <h1>You're Offline</h1>

        <p>
            It looks like you've lost your internet connection. Don't worry - you can still access
            some features of Agenty Platform while offline.
        </p>

        <div class="buttons">
            <button onclick="tryReconnect()">Try to Reconnect</button>
            <button onclick="goHome()">Go to Dashboard</button>
            <button onclick="viewCached()">View Cached Agents</button>
        </div>

        <div class="status" id="status">
            <strong>Connection Status:</strong> <span id="connection-status" class="pulse">Checking...</span>
        </div>
    </div>

    <script>
        let retryAttempts = 0;
        const maxRetries = 5;

        function updateConnectionStatus() {
            const statusElement = document.getElementById('connection-status');

            if (navigator.onLine) {
                statusElement.textContent = 'Online - Attempting to restore connection...';
                statusElement.className = '';
                setTimeout(() => {
                    window.location.href = '/';
                }, 1000);
            } else {
                statusElement.textContent = 'Offline';
                statusElement.className = 'pulse';
            }
        }

        function tryReconnect() {
            retryAttempts++;
            const statusElement = document.getElementById('connection-status');

            statusElement.textContent = `Reconnecting... (Attempt ${retryAttempts}/${maxRetries})`;

            fetch('/')
                .then(response => {
                    if (response.ok) {
                        statusElement.textContent = 'Connected! Redirecting...';
                        setTimeout(() => {
                            window.location.href = '/';
                        }, 1000);
                    } else {
                        throw new Error('Connection failed');
                    }
                })
                .catch(() => {
                    if (retryAttempts >= maxRetries) {
                        statusElement.textContent = 'Connection failed. Please check your internet connection.';
                    } else {
                        statusElement.textContent = 'Retrying in 3 seconds...';
                        setTimeout(tryReconnect, 3000);
                    }
                });
        }

        function goHome() {
            window.location.href = '/';
        }

        function viewCached() {
            window.location.href = '/agents';
        }

        // Listen for online/offline events
        window.addEventListener('online', updateConnectionStatus);
        window.addEventListener('offline', updateConnectionStatus);

        // Initial status check
        updateConnectionStatus();

        // Periodic connection check
        setInterval(() => {
            if (!navigator.onLine) {
                fetch('/', { mode: 'no-cors' })
                    .then(() => {
                        window.location.href = '/';
                    })
                    .catch(() => {
                        // Still offline
                    });
            }
        }, 10000);
    </script>
</body>
</html>
